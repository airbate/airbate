<svg xmlns="http://www.w3.org/2000/svg" width="800" height="555" viewBox="0 0 800 555" role="img"><title>🩷 Backstage · 关于我</title><rect x="1" y="1" width="798" height="553" rx="22" fill="#fff2f6" stroke="#ecc3d4" stroke-width="2"/><rect x="734" y="25" width="13" height="13" rx="3" fill="#92c9e7"/><rect x="752" y="40" width="13" height="13" rx="3" fill="#f0d77c"/><text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="650" fill="#9e4f77">🩷 Backstage · 关于我</text><path d="M40 70H760" stroke="#efc9d8"/><text x="40" y="112" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">我是 airbate，全栈开发者，目前在探月具身智能社区实习，也</text><text x="40" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">在创业。关注 AI Agent、具身智能、机器人和开发者工具，喜</text><text x="40" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">欢把想法做成可以实际使用的产品。</text><text x="40" y="241" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">平时主要写代码、做原型，从 Web 应用、自动化工作流到嵌入式</text><text x="40" y="279" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">硬件都会尝试。对 AI 如何参与日常工作、如何与硬件和真实场</text><text x="40" y="317" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">景结合尤其感兴趣，也在学习产品开发和创业过程中技术之外的事</text><text x="40" y="355" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">情。</text><text x="40" y="408" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">代码之外，我会写 AI 科普、整理 Obsidian 知识库，记录项目</text><text x="40" y="446" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">里的尝试和踩过的坑。欢迎交流技术、开源项目，以及值得一起动</text><text x="40" y="484" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">手做的想法。</text></svg>