<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img"><title>AI 庄周是否梦到电子蝴蝶</title><rect x="1" y="1" width="798" height="308" rx="22" fill="#fff2f6" stroke="#ecc3d4" stroke-width="2"/><rect x="734" y="25" width="13" height="13" rx="3" fill="#92c9e7"/><rect x="752" y="40" width="13" height="13" rx="3" fill="#f0d77c"/><text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="650" fill="#9e4f77">AI 庄周是否梦到电子蝴蝶</text><path d="M40 70H760" stroke="#efc9d8"/><text x="40" y="112" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">造工具 · 写文字 · 把 AI 接到真实世界</text><text x="40" y="165" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858">Building tools, writing words, connecting AI to the</text><text x="40" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#654858"> real world.</text><text x="40" y="260" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#9f7488">社恐归社恐，commit 还是要交的。 / A little shy. Still shipping.</text></svg>